# TEMPORARY (removed before the PR): saves hourly snapshots of US house 113 so sale counting can be checked.
name: Sold probe
on:
  push:
    branches: ['claude/**']
    paths: [scripts/probe/sold_probe.py, .github/workflows/sold-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe/sold_probe.py
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PROBE_SNAPS: '5'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe-out/
          retention-days: 2
