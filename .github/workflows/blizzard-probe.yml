# One-time check of Blizzard's Forever auction data (summary only, keys stay secret). Runs on pushes that change it.
name: Blizzard API probe
on:
  push:
    branches: [claude/project-thread-dkaluu]
    paths: [scripts/blizzard_probe.py, .github/workflows/blizzard-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/blizzard_probe.py
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
