# One-off probe (branch only, removed before any merge).
name: Blizzard API probe
on:
  push:
    branches: ['claude/**']
    paths: [scripts/probe/static_dump.py, .github/workflows/blizzard-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe/static_dump.py
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static
          path: static.json.gz
          retention-days: 2
